services:
  - type: web
    name: k12-backend-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_URI
        sync: false # Set this manually in Render dashboard
      - key: CORS_ORIGIN
        value: "*" # Update this for production security
    healthCheckPath: /health
    autoDeploy: true